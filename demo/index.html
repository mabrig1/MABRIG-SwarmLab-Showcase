<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwarmLab portfolio simulation</title><style>body{font:16px system-ui;background:#101827;color:#edf4ff;max-width:720px;margin:40px auto;padding:20px}button,input{font:inherit}button{padding:12px;background:#a7e3d4;border:0;border-radius:8px}li{padding:8px}progress{width:100%}</style><h1>SwarmLab — illustrative coordination</h1><p>Independent browser simulation. No AI inference or external actions.</p><label>Specialists <input id="count" type="range" min="20" max="50" value="20"> <output id="n">20</output></label><p><button id="start">Run simulation</button></p><progress id="progress" value="0" max="20"></progress><ol id="log" aria-live="polite"></ol><script>const c=document.querySelector('#count'),n=document.querySelector('#n'),p=document.querySelector('#progress'),l=document.querySelector('#log'),b=document.querySelector('#start');c.oninput=()=>n.value=c.value;b.onclick=async()=>{b.disabled=true;c.disabled=true;l.replaceChildren();let total=Number(c.value);p.max=total;p.value=0;for(let wave=1;wave<=4;wave++){await new Promise(r=>setTimeout(r,350));p.value=Math.floor(total*wave/4);let li=document.createElement('li');li.textContent='Illustrative wave '+wave+': '+p.value+' of '+total+' simulated specialists complete';l.append(li)}let li=document.createElement('li');li.textContent='Human review required. No external work performed.';l.append(li);b.disabled=false;c.disabled=false};</script></html>
